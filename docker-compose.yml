services:

  db:
    image: postgres:15-alpine
    container_name: construction_db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: constructiondb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d constructiondb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: construction_api
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
