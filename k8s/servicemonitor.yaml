apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: construction-api-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - construction
  selector:
    matchLabels:
      app: construction-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s